name: LocalLens v3.2 Keyboard IPA
on:
  push:
    branches:
      - locallens-v3-2-keyboard-20261014
    paths:
      - "LocalLens/**"
      - ".github/workflows/locallens-ipa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install cmake ninja xcodegen
      - name: Build Metal + multimodal llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cyyself/OpenTihui.git upstream
          git -C upstream submodule update --init --depth 1 llama.cpp
          (cd upstream/llama.cpp && bash ../scripts/build-llama-ios.sh)
          mkdir -p LocalLens/Vendor LocalLens/Sources LocalLens/Support
          cp -R upstream/llama.cpp/build-apple/llama.xcframework LocalLens/Vendor/
          cp upstream/src/openTihui/Bridge/LlamaBridge.h LocalLens/Sources/
          cp upstream/src/openTihui/Bridge/LlamaBridge.mm LocalLens/Sources/
          cp upstream/LICENSE LocalLens/UPSTREAM-LICENSE.txt
          test -f LocalLens/Vendor/llama.xcframework/Info.plist
      - name: Generate full-resolution app icon
        run: |
          set -euo pipefail
          swift LocalLens/Support/generate_icon.swift LocalLens/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight LocalLens/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate Xcode project
        run: |
          cd LocalLens
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project LocalLens/LocalLens.xcodeproj -scheme LocalLens -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Verify stability features are present
        run: |
          set -euo pipefail
          grep -q 'CGImageSourceCreateThumbnailAtIndex' LocalLens/Sources/LocalLensApp.swift
          grep -q 'minimumImageMemoryMB' LocalLens/Sources/LocalLensApp.swift
          grep -q 'deleteFile(_ file: URL)' LocalLens/Sources/LocalLensApp.swift
          grep -q 'Coming Soon' LocalLens/Sources/LocalLensApp.swift
          grep -q 'conversationKey' LocalLens/Sources/LocalLensApp.swift
          grep -q 'settingsSheet' LocalLens/Sources/LocalLensApp.swift
          grep -q 'phys_footprint' LocalLens/Sources/LocalLensApp.swift
          grep -q 'physicalMemory' LocalLens/Sources/LocalLensApp.swift
          grep -q 'More memory iOS permits this app' LocalLens/Sources/LocalLensApp.swift
          grep -q 'scrollDismissesKeyboard(.interactively)' LocalLens/Sources/LocalLensApp.swift
          grep -q 'keyboard.chevron.compact.down' LocalLens/Sources/LocalLensApp.swift
          grep -q '@FocusState private var chatInputFocused' LocalLens/Sources/LocalLensApp.swift
          echo 'Stability source checks passed'
      - name: Package unsigned IPA and verify app
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/LocalLens.app"
          test -f "$APP/LocalLens"
          test -f "$APP/Info.plist"
          test -d "$APP/Frameworks/llama.framework"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" | grep -qx "AppIcon"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -q -r ../LocalLens-v3.2-Keyboard.ipa Payload)
          unzip -t LocalLens-v3.2-Keyboard.ipa | tail -n 1
          ls -lh LocalLens-v3.2-Keyboard.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LocalLens-v3.2-Keyboard-IPA
          path: LocalLens-v3.2-Keyboard.ipa
          if-no-files-found: error
